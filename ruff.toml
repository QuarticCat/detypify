# Ref: https://github.com/pypa/hatch/blob/master/scripts/update_ruff.py

line-length = 120
src = ["python"]

[lint]
select = ["ALL"]
ignore = [
  # Project-specific choices
  "PLC0415", # Allow lazy imports for heavy optional dependencies

  # Rules that depend on the project or require disproportionate effort
  "AIR",
  "ANN",
  "B027",
  "C901",
  "CPY",
  "D",
  "DJ",
  "FBT003",
  "FIX",
  "NPY",
  "PD",
  "PTH",
  "PLR0904",
  "PLR0911",
  "PLR0912",
  "PLR0913",
  "PLR0914",
  "PLR0915",
  "PLR0916",
  "PLR0917",
  "PLR1702",
  "TD001",
  "TD002",
  "TD003",

  # Rules with common false positives or valid exceptions
  "ERA001",
  "FURB101",
  "FURB103",
  "FURB140",
  "PERF203",
  "PGH003",
  "PGH004",
  "RET501",
  "RET502",
  "RUF200",
  "S404",
  "S603",
  "SIM401",

  # Rules that conflict with the formatter
  "COM812",
  "COM819",
  "E111",
  "E114",
  "E117",
  "E301",
  "E302",
  "E303",
  "E304",
  "E305",
  "E306",
  "E501",
  "ISC001",
  "ISC002",
  "Q",
  "W191",
]

[lint.per-file-ignores]
"python/*.py" = ["INP001"]

[lint.isort]
known-first-party = ["detypify"]
