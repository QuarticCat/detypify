[project]
name = "detypify-model"
version = "0.3.0"
requires-python = ">=3.13"
authors = [
  { name = "QuarticCat", email = "QuarticCat@pm.me" },
  { name = "Cloud0310", email = "gh@touchingfish.day" },
  { name = "Edward40", email = "sasuke688848@gmail.com" },
]
dependencies = [
  "cappa>=0.33.0",
  "lightning>=2.6.6",
  "lxml>=6.1.3",
  "lxml-stubs>=0.5.1",
  "msgspec>=0.22.0",
  "onnx>=1.23.2",
  "onnxscript>=0.7.2",
  "opencv-python-headless>=5.0.0.93",
  "polars>=2.0.0",
  "timm>=1.0.30",
  "unicodeit==0.7.5",
]

[project.optional-dependencies]
cpu = [
  "torch>=2.6.0",
  "torchvision",
]
cuda12 = [
  "torch>=2.6.0 ; sys_platform != 'darwin'",
  "torchvision ; sys_platform != 'darwin'",
]
cuda13 = [
  "torch>=2.6.0 ; sys_platform != 'darwin'",
  "torchvision ; sys_platform != 'darwin'",
]
rocm = [
  "torch>=2.6.0",
  "torchvision",
  "triton-rocm ; sys_platform == 'linux'",
  "rocm ; sys_platform == 'linux'",
  "rocm-sdk-core ; sys_platform == 'linux'",
  "rocm-sdk-libraries ; sys_platform == 'linux'",
  # GPU target: python/README.md#amd-rocm-installation
  "rocm-sdk-device-gfx1030 ; sys_platform == 'linux'",
]

[dependency-groups]
dev = [
  # for data wrangler
  "ipykernel>=7.4.0",
  "matplotlib>=3.11.2",
  # ort export
  "onnxruntime>=1.31.0",
  # lsp and tensor shape
  # pyrefly-torch-stubs is released in lockstep with pyrefly, upgrade both together
  "pyrefly>=1.3.2",
  "pyrefly-torch-stubs>=1.3.2",
  # formatter and linter
  "ruff>=0.17.0",
  # training logs
  "tensorboard>=2.21.0",
  "tensorboardx>=2.6.5",
  "torch-tb-profiler>=0.4.3",
  # profiler
  "viztracer>=1.1.1",
]

[tool.pyrefly]
search-path = ["./python"]

[tool.uv]
# Select device kernels; also overrides PyTorch's ROCm version constraint.
override-dependencies = [
  # GPU target: python/README.md#amd-rocm-installation
  "rocm[libraries,device-gfx1030] ; sys_platform == 'linux'",
]
environments = [
  "sys_platform == 'darwin'",
  "sys_platform == 'linux'",
  "sys_platform == 'win32'",
]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cuda13" },
    { extra = "cuda12" },
    { extra = "rocm" },
  ],
]

# target torch to CPU, CUDA or RoCM
[tool.uv.sources]
rocm = { index = "pytorch-rocm", marker = "sys_platform == 'linux'" }
rocm-sdk-core = { index = "pytorch-rocm", marker = "sys_platform == 'linux'" }
rocm-sdk-libraries = { index = "pytorch-rocm", marker = "sys_platform == 'linux'" }
# GPU target: python/README.md#amd-rocm-installation
rocm-sdk-device-gfx1030 = { index = "pytorch-rocm", marker = "sys_platform == 'linux'" }
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu12", extra = "cuda12", marker = "platform_system != 'Darwin'" },
  { index = "pytorch-cu13", extra = "cuda13", marker = "platform_system != 'Darwin'" },
  { index = "pytorch-rocm", extra = "rocm", marker = "platform_system == 'Linux'" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu12", extra = "cuda12", marker = "platform_system != 'Darwin'" },
  { index = "pytorch-cu13", extra = "cuda13", marker = "platform_system != 'Darwin'" },
  { index = "pytorch-rocm", extra = "rocm", marker = "platform_system == 'Linux'" },
]
triton-rocm = [
  { index = "pytorch-rocm", extra = "rocm", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu12"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu13"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm"
# Release selection: python/README.md#amd-rocm-installation
url = "https://download.pytorch.org/whl/rocm7.14"
explicit = true
