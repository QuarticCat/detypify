packages:
  - 'frontend/*'

# Rebuild the service when generated files in service/train change.
optimisticRepeatInstall: false

# Allow install scripts required by build dependencies.
allowBuilds:
  esbuild: true
  protobufjs: true
  sharp: true
  workerd: true

# Keep vulnerable transitive dependencies above their patched versions.
overrides:
  sharp@<0.35.0: 0.35.2
